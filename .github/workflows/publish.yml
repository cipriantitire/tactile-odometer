name: publish
# Trusted publishing: npm trusts this workflow through OIDC, so there is no token
# to leak. Configure it once on npmjs.com (package settings > Trusted publisher:
# GitHub Actions, cipriantitire / tactile-odometer / publish.yml) after the first
# publish from a terminal. Needs npm 11.5.1 or later, hence the upgrade below.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --access public
